<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser League - Freeplay</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }
        #message {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: #FFD700;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        h3 { margin: 0 0 10px 0; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Freeplay Controls</h3>
        <p><b>W, A, S, D:</b> Drive / Steer / Aerial Pitch & Roll</p>
        <p><b>Shift:</b> Boost</p>
        <p><b>Space:</b> Jump / Double-Jump Flip</p>
        <p><b>R:</b> Reset Ball</p>
        <p><b>T:</b> Reset Car</p>
    </div>
    <div id="message">GOAL!</div>

    <!-- Use ES Modules from CDN -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        // --- GAME STATE ---
        let scoreBlocked = false;
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        let jumpState = 0; // 0 = grounded, 1 = first jump, 2 = flipped

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 100;
        dirLight.shadow.camera.bottom = -100;
        dirLight.shadow.camera.left = -100;
        dirLight.shadow.camera.right = 100;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- CANNON.JS SETUP ---
        const world = new CANNON.World({
            gravity: new CANNON.Vec3(0, -15, 0), // Slightly higher gravity than earth for snappy feel
        });
        
        // Physics Materials
        const groundMat = new CANNON.Material();
        const wheelMat = new CANNON.Material();
        const ballMat = new CANNON.Material();
        const carMat = new CANNON.Material();

        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, wheelMat, { friction: 0.5 }));
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, ballMat, { friction: 0.2, restitution: 0.8 }));
        world.addContactMaterial(new CANNON.ContactMaterial(carMat, ballMat, { friction: 0.5, restitution: 0.9 }));

        // --- ENVIRONMENT SETUP ---
        const arenaLength = 120;
        const arenaWidth = 80;
        const wallHeight = 20;

        function createMeshFromShape(body, shape, material, color) {
            let mesh;
            if (shape instanceof CANNON.Box) {
                const geo = new THREE.BoxGeometry(shape.halfExtents.x * 2, shape.halfExtents.y * 2, shape.halfExtents.z * 2);
                mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color }));
            } else if (shape instanceof CANNON.Sphere) {
                const geo = new THREE.SphereGeometry(shape.radius, 32, 32);
                mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.3 }));
            }
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // Floor
        const floorShape = new CANNON.Box(new CANNON.Vec3(arenaWidth / 2, 0.5, arenaLength / 2));
        const floorBody = new CANNON.Body({ mass: 0, material: groundMat });
        floorBody.addShape(floorShape);
        floorBody.position.y = -0.5;
        world.addBody(floorBody);
        
        // Floor visuals (Grass pattern)
        const floorGeo = new THREE.PlaneGeometry(arenaWidth, arenaLength);
        const floorMeshMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMeshMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // Walls (Invisible to allow rendering skybox, but bouncy)
        const wallShapes = [
            { pos: [0, wallHeight/2, arenaLength/2], extents: [arenaWidth/2, wallHeight/2, 1] },
            { pos: [0, wallHeight/2, -arenaLength/2], extents: [arenaWidth/2, wallHeight/2, 1] },
            { pos: [arenaWidth/2, wallHeight/2, 0], extents: [1, wallHeight/2, arenaLength/2] },
            { pos: [-arenaWidth/2, wallHeight/2, 0], extents: [1, wallHeight/2, arenaLength/2] }
        ];
        wallShapes.forEach(w => {
            const wallBody = new CANNON.Body({ mass: 0, material: groundMat });
            wallBody.addShape(new CANNON.Box(new CANNON.Vec3(...w.extents)));
            wallBody.position.set(...w.pos);
            world.addBody(wallBody);
            
            // Basic visible wall borders
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w.extents[0]*2, w.extents[1]*2, w.extents[2]*2),
                new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 })
            );
            mesh.position.set(...w.pos);
            scene.add(mesh);
        });

        // Invisible Ceiling
        const ceilingBody = new CANNON.Body({ mass: 0, material: groundMat });
        ceilingBody.addShape(new CANNON.Box(new CANNON.Vec3(arenaWidth/2, 1, arenaLength/2)));
        ceilingBody.position.y = wallHeight;
        world.addBody(ceilingBody);

        // Goals (Visual indicators)
        const goalWidth = 20;
        const goalHeight = 8;
        const goalDepth = 5;
        const createGoalVisual = (z, color) => {
            const geo = new THREE.BoxGeometry(goalWidth, goalHeight, goalDepth);
            const mat = new THREE.MeshStandardMaterial({ color: color, wireframe: true, emissive: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, goalHeight/2, z);
            scene.add(mesh);
        };
        createGoalVisual(-arenaLength/2 + goalDepth/2, 0xff5500); // Orange
        createGoalVisual(arenaLength/2 - goalDepth/2, 0x0055ff); // Blue

        // --- BALL SETUP ---
        const ballRadius = 1.5;
        const ballShape = new CANNON.Sphere(ballRadius);
        const ballBody = new CANNON.Body({ mass: 1, material: ballMat, linearDamping: 0.1, angularDamping: 0.1 });
        ballBody.addShape(ballShape);
        world.addBody(ballBody);
        const ballMesh = createMeshFromShape(ballBody, ballShape, null, 0xffffff);

        // --- CAR SETUP ---
        const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 2));
        const chassisBody = new CANNON.Body({ mass: 150, material: carMat });
        chassisBody.addShape(chassisShape);
        // Lower center of mass to prevent tipping over easily
        chassisBody.position.set(0, 2, 30); 
        
        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: chassisBody,
            indexRightAxis: 0,
            indexUpAxis: 1,
            indexForwardAxis: 2
        });

        const options = {
            radius: 0.5,
            directionLocal: new CANNON.Vec3(0, -1, 0),
            suspensionStiffness: 30,
            suspensionRestLength: 0.3,
            frictionSlip: 5,
            dampingRelaxation: 2.3,
            dampingCompression: 4.4,
            maxSuspensionForce: 100000,
            rollInfluence: 0.1, // Less body roll
            axleLocal: new CANNON.Vec3(-1, 0, 0),
            chassisConnectionPointLocal: new CANNON.Vec3(),
            maxSuspensionTravel: 0.3,
            customSlidingRotationalSpeed: -30,
            useCustomSlidingRotationalSpeed: true
        };

        // Add Wheels
        options.chassisConnectionPointLocal.set(1, 0, 1.2);
        vehicle.addWheel(options); // FL
        options.chassisConnectionPointLocal.set(-1, 0, 1.2);
        vehicle.addWheel(options); // FR
        options.chassisConnectionPointLocal.set(1, 0, -1.2);
        vehicle.addWheel(options); // RL
        options.chassisConnectionPointLocal.set(-1, 0, -1.2);
        vehicle.addWheel(options); // RR
        vehicle.addToWorld(world);

        // Wheel visual meshes
        const wheelBodies = [];
        const wheelVisuals = [];
        for (let i = 0; i < vehicle.wheelInfos.length; i++) {
            const cylinderShape = new CANNON.Cylinder(options.radius, options.radius, 0.4, 20);
            const wheelBody = new CANNON.Body({ mass: 0, material: wheelMat });
            // Rotate cylinder to act like a wheel
            const q = new CANNON.Quaternion();
            q.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), Math.PI / 2);
            wheelBody.addShape(cylinderShape, new CANNON.Vec3(), q);
            wheelBodies.push(wheelBody);
            
            const geo = new THREE.CylinderGeometry(options.radius, options.radius, 0.4, 20);
            geo.rotateZ(Math.PI / 2);
            const mat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
            wheelVisuals.push(mesh);
        }
        
        // Update wheels from vehicle dynamics
        world.addEventListener('postStep', () => {
            for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                vehicle.updateWheelTransform(i);
                const t = vehicle.wheelInfos[i].worldTransform;
                wheelVisuals[i].position.copy(t.position);
                wheelVisuals[i].quaternion.copy(t.quaternion);
            }
        });

        const chassisMesh = createMeshFromShape(chassisBody, chassisShape, null, 0xff0000);
        
        // --- BOOST PARTICLES ---
        const boostLight = new THREE.PointLight(0xffaa00, 0, 10);
        scene.add(boostLight);

        // --- RESET FUNCTIONS ---
        function resetBall() {
            ballBody.position.set(0, 5, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
        }

        function resetCar() {
            chassisBody.position.set(0, 2, 30);
            chassisBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), 0);
            chassisBody.velocity.set(0, 0, 0);
            chassisBody.angularVelocity.set(0, 0, 0);
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if (e.key === 'Shift') keys.shift = true;
            if (e.key === 'r' || e.key === 'R') resetBall();
            if (e.key === 't' || e.key === 'T') resetCar();

            // Jump & Flip Logic
            if (e.key === ' ') {
                const isGrounded = vehicle.wheelInfos.some(w => w.inContact);
                
                if (isGrounded) {
                    // First jump
                    chassisBody.applyLocalImpulse(new CANNON.Vec3(0, 800, 0), new CANNON.Vec3(0, 0, 0));
                    jumpState = 1;
                } else if (jumpState === 1) {
                    // Mid-air flip (directional)
                    jumpState = 2; // Can't flip again
                    let flipImpulse = new CANNON.Vec3(0, 0, 0);
                    let torqueImpulse = new CANNON.Vec3(0, 0, 0);
                    
                    if (keys.w) { torqueImpulse.x = -3000; flipImpulse.z = 1000; } // Front flip
                    if (keys.s) { torqueImpulse.x = 3000; flipImpulse.z = -1000; } // Back flip
                    if (keys.a) { torqueImpulse.z = 3000; flipImpulse.x = 1000; } // Left roll
                    if (keys.d) { torqueImpulse.z = -3000; flipImpulse.x = -1000; } // Right roll
                    
                    if(keys.w || keys.s || keys.a || keys.d) {
                        chassisBody.applyLocalImpulse(flipImpulse, new CANNON.Vec3(0, 0, 0));
                        chassisBody.applyTorque(chassisBody.quaternion.vmult(torqueImpulse));
                    } else {
                        // Double jump straight up
                        chassisBody.applyLocalImpulse(new CANNON.Vec3(0, 600, 0), new CANNON.Vec3(0, 0, 0));
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.key === 'Shift') keys.shift = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize positions
        resetBall();
        resetCar();

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            // Step Physics
            world.step(1 / 60, dt, 3);

            // Sync visual meshes to physics bodies
            chassisMesh.position.copy(chassisBody.position);
            chassisMesh.quaternion.copy(chassisBody.quaternion);
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            const isGrounded = vehicle.wheelInfos.some(w => w.inContact);
            if (isGrounded) jumpState = 0; // Reset jump when landing

            // --- CAR CONTROL LOGIC ---
            const engineForce = 800;
            const maxSteerVal = 0.5;

            // Ground Driving
            if (isGrounded) {
                if (keys.w) vehicle.applyEngineForce(-engineForce, 2), vehicle.applyEngineForce(-engineForce, 3);
                else if (keys.s) vehicle.applyEngineForce(engineForce, 2), vehicle.applyEngineForce(engineForce, 3);
                else vehicle.applyEngineForce(0, 2), vehicle.applyEngineForce(0, 3);

                if (keys.a) vehicle.setSteeringValue(maxSteerVal, 0), vehicle.setSteeringValue(maxSteerVal, 1);
                else if (keys.d) vehicle.setSteeringValue(-maxSteerVal, 0), vehicle.setSteeringValue(-maxSteerVal, 1);
                else vehicle.setSteeringValue(0, 0), vehicle.setSteeringValue(0, 1);
            } 
            // Aerial Controls (Pitch / Roll)
            else {
                vehicle.applyEngineForce(0, 2), vehicle.applyEngineForce(0, 3);
                vehicle.setSteeringValue(0, 0), vehicle.setSteeringValue(0, 1);

                const torque = new CANNON.Vec3(0, 0, 0);
                if (keys.w) torque.x = -800;
                if (keys.s) torque.x = 800;
                if (keys.a) torque.z = 800;
                if (keys.d) torque.z = -800;
                
                if (torque.lengthSquared() > 0) {
                    chassisBody.applyTorque(chassisBody.quaternion.vmult(torque));
                }
            }

            // Boost
            if (keys.shift) {
                const boostForce = new CANNON.Vec3(0, 0, -1200);
                chassisBody.applyLocalForce(boostForce, new CANNON.Vec3(0, 0, 0));
                
                // Visual boost indicator
                const backOffset = new THREE.Vector3(0, 0, 1).applyQuaternion(chassisMesh.quaternion);
                boostLight.position.copy(chassisMesh.position).add(backOffset);
                boostLight.intensity = 2;
            } else {
                boostLight.intensity = 0;
            }

            // --- CAMERA FOLLOW ---
            // Calculate a target behind and above the car
            const relativeCameraOffset = new THREE.Vector3(0, 5, 12);
            const cameraOffset = relativeCameraOffset.applyMatrix4(chassisMesh.matrixWorld);
            
            // Smoothly move camera
            camera.position.lerp(cameraOffset, 0.1);
            // Look slightly ahead of the car
            const lookTarget = new THREE.Vector3(0, 0, -5).applyMatrix4(chassisMesh.matrixWorld);
            camera.lookAt(lookTarget);

            // --- GOAL LOGIC ---
            if (!scoreBlocked) {
                // Check if ball is beyond goal line (z) and inside goal width (x)
                const inXBounds = Math.abs(ballBody.position.x) < goalWidth / 2;
                const inBlueGoal = ballBody.position.z > (arenaLength / 2 - 2) && inXBounds;
                const inOrangeGoal = ballBody.position.z < -(arenaLength / 2 - 2) && inXBounds;

                if (inBlueGoal || inOrangeGoal) {
                    console.log("Goal!");
                    scoreBlocked = true;
                    
                    const msg = document.getElementById('message');
                    msg.style.opacity = 1;
                    msg.style.color = inBlueGoal ? '#ff5500' : '#0055ff'; 
                    msg.innerText = inBlueGoal ? "ORANGE SCORES!" : "BLUE SCORES!";

                    // Reset sequence
                    setTimeout(() => {
                        resetBall();
                        resetCar();
                        msg.style.opacity = 0;
                        scoreBlocked = false;
                    }, 2000);
                }
            }

            renderer.render(scene, camera);
        }

        // Start Loop
        animate();
    </script>
</body>
</html>
