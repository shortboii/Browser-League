<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser League - Enhanced</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(13, 17, 23, 0.85);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #ui h3 { margin: 0 0 15px 0; color: #58a6ff; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        #ui p { margin: 8px 0; font-size: 14px; }
        .key { 
            background: #21262d; 
            padding: 3px 8px; 
            border-radius: 4px; 
            border: 1px solid #30363d; 
            color: #c9d1d9;
            font-family: monospace;
            font-weight: bold;
        }
        #message {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0px 0px 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: scale(0.5);
            pointer-events: none;
        }
        .show-msg {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Controls</h3>
        <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> &nbsp;Drive / Aerial Pitch & Roll</p>
        <p><span class="key">J</span> &nbsp;Boost</p>
        <p><span class="key">K</span> &nbsp;Jump / Mid-Air Flip</p>
        <p><span class="key">R</span> &nbsp;Reset Ball</p>
        <p><span class="key">T</span> &nbsp;Reset Car</p>
    </div>
    <div id="message">GOAL!</div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        // --- GAME STATE ---
        const keys = { w: false, a: false, s: false, d: false, j: false, k: false };
        let jumpState = 0; // 0 = grounded, 1 = first jump, 2 = flipped
        let scoreBlocked = false;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 80, 250);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const stadiumLight = new THREE.PointLight(0xffffff, 0.8, 300);
        stadiumLight.position.set(0, 100, 0);
        stadiumLight.castShadow = true;
        stadiumLight.shadow.mapSize.width = 2048;
        stadiumLight.shadow.mapSize.height = 2048;
        scene.add(stadiumLight);

        // --- CANNON.JS SETUP ---
        const world = new CANNON.World({
            gravity: new CANNON.Vec3(0, -18, 0), // Snappy gravity
        });
        
        // Physics Materials
        const groundMat = new CANNON.Material();
        const wheelMat = new CANNON.Material();
        const ballMat = new CANNON.Material();
        const carMat = new CANNON.Material();

        // Lower friction on wheels to allow drifting instead of flipping
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, wheelMat, { friction: 0.4 }));
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, ballMat, { friction: 0.1, restitution: 0.8 }));
        world.addContactMaterial(new CANNON.ContactMaterial(carMat, ballMat, { friction: 0.4, restitution: 0.6 }));
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, carMat, { friction: 0.1, restitution: 0.1 })); // Sliding chassis

        // --- ENVIRONMENT SETUP ---
        const arenaLength = 160;
        const arenaWidth = 100;
        const wallHeight = 30;
        const goalWidth = 24;
        const goalDepth = 10;
        const goalHeight = 10;

        // Visual Arena Grid (Rocket Ball Style)
        const gridHelper = new THREE.GridHelper(arenaLength, 40, 0x444455, 0x222233);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(arenaWidth, arenaLength);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.8, metalness: 0.2 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // Physical Floor
        const floorShape = new CANNON.Box(new CANNON.Vec3(arenaWidth / 2, 0.5, arenaLength / 2));
        const floorBody = new CANNON.Body({ mass: 0, material: groundMat });
        floorBody.addShape(floorShape);
        floorBody.position.y = -0.5;
        world.addBody(floorBody);

        // Glass Walls Function
        const createWall = (x, y, z, width, height, depth) => {
            // Physics
            const shape = new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2));
            const body = new CANNON.Body({ mass: 0, material: groundMat });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);

            // Visuals
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x58a6ff, 
                transparent: true, 
                opacity: 0.1,
                wireframe: false
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // Edge Highlights
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x58a6ff, opacity: 0.5, transparent: true }));
            line.position.set(x, y, z);
            scene.add(line);
        };

        // Side Walls
        createWall(arenaWidth/2 + 1, wallHeight/2, 0, 2, wallHeight, arenaLength);
        createWall(-arenaWidth/2 - 1, wallHeight/2, 0, 2, wallHeight, arenaLength);

        // Back Walls (Split to leave space for goals)
        const wallSegmentWidth = (arenaWidth - goalWidth) / 2;
        const segmentOffset = goalWidth/2 + wallSegmentWidth/2;

        // Blue Side Back Walls
        createWall(segmentOffset, wallHeight/2, arenaLength/2 + 1, wallSegmentWidth, wallHeight, 2);
        createWall(-segmentOffset, wallHeight/2, arenaLength/2 + 1, wallSegmentWidth, wallHeight, 2);
        createWall(0, wallHeight/2 + goalHeight/2, arenaLength/2 + 1, goalWidth, wallHeight - goalHeight, 2); // Above goal

        // Orange Side Back Walls
        createWall(segmentOffset, wallHeight/2, -arenaLength/2 - 1, wallSegmentWidth, wallHeight, 2);
        createWall(-segmentOffset, wallHeight/2, -arenaLength/2 - 1, wallSegmentWidth, wallHeight, 2);
        createWall(0, wallHeight/2 + goalHeight/2, -arenaLength/2 - 1, goalWidth, wallHeight - goalHeight, 2); // Above goal

        // Invisible Ceiling
        const ceilingBody = new CANNON.Body({ mass: 0, material: groundMat });
        ceilingBody.addShape(new CANNON.Box(new CANNON.Vec3(arenaWidth/2, 1, arenaLength/2)));
        ceilingBody.position.y = wallHeight;
        world.addBody(ceilingBody);

        // Goal Visuals
        const createGoal = (z, color) => {
            const geo = new THREE.BoxGeometry(goalWidth, goalHeight, goalDepth);
            const mat = new THREE.MeshStandardMaterial({ color: color, wireframe: true, emissive: color, emissiveIntensity: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, goalHeight/2, z);
            scene.add(mesh);
            
            // Goal Light
            const gLight = new THREE.PointLight(color, 1, 40);
            gLight.position.set(0, goalHeight/2, z);
            scene.add(gLight);
        };
        createGoal(-arenaLength/2 - goalDepth/2, 0xff5500); // Orange
        createGoal(arenaLength/2 + goalDepth/2, 0x0055ff); // Blue

        // --- BALL SETUP ---
        const ballRadius = 2.0;
        const ballShape = new CANNON.Sphere(ballRadius);
        const ballBody = new CANNON.Body({ mass: 1, material: ballMat, linearDamping: 0.1, angularDamping: 0.1 });
        ballBody.addShape(ballShape);
        world.addBody(ballBody);
        
        const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const ballVisMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.5 });
        const ballMesh = new THREE.Mesh(ballGeo, ballVisMat);
        ballMesh.castShadow = true;
        scene.add(ballMesh);

        // --- CAR SETUP (ANTI-FLIP FIXES) ---
        const chassisExtents = new CANNON.Vec3(1.1, 0.4, 2.2);
        const chassisShape = new CANNON.Box(chassisExtents);
        const chassisBody = new CANNON.Body({ mass: 200, material: carMat });
        
        // FIX 1: Offset the collision shape downwards so the Center of Mass is extremely low!
        chassisBody.addShape(chassisShape, new CANNON.Vec3(0, -0.3, 0)); 
        chassisBody.position.set(0, 2, 40);
        
        // Car Visuals Container (to match offset)
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        const chassisVisGeo = new THREE.BoxGeometry(chassisExtents.x*2, chassisExtents.y*2, chassisExtents.z*2);
        const chassisVisMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.4, metalness: 0.8 });
        const chassisMesh = new THREE.Mesh(chassisVisGeo, chassisVisMat);
        chassisMesh.position.set(0, -0.3, 0); // Offset mesh to match physical CoM offset
        chassisMesh.castShadow = true;
        carGroup.add(chassisMesh);

        // Create Vehicle
        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: chassisBody,
            indexRightAxis: 0,
            indexUpAxis: 1,
            indexForwardAxis: 2
        });

        const options = {
            radius: 0.5,
            directionLocal: new CANNON.Vec3(0, -1, 0),
            suspensionStiffness: 45, // stiffer suspension
            suspensionRestLength: 0.4,
            frictionSlip: 3, // FIX 2: Lower friction so tires slide sideways instead of catching
            dampingRelaxation: 2.3,
            dampingCompression: 4.4,
            maxSuspensionForce: 100000,
            rollInfluence: 0.02, // FIX 3: Almost zero roll influence prevents chassis tipping
            axleLocal: new CANNON.Vec3(-1, 0, 0),
            chassisConnectionPointLocal: new CANNON.Vec3(),
            maxSuspensionTravel: 0.3,
            customSlidingRotationalSpeed: -30,
            useCustomSlidingRotationalSpeed: true
        };

        // Widen the wheelbase for extra stability
        const wheelX = 1.1; 
        const wheelY = -0.1;
        const wheelZ = 1.3;

        options.chassisConnectionPointLocal.set(wheelX, wheelY, wheelZ);
        vehicle.addWheel(options); // FL
        options.chassisConnectionPointLocal.set(-wheelX, wheelY, wheelZ);
        vehicle.addWheel(options); // FR
        options.chassisConnectionPointLocal.set(wheelX, wheelY, -wheelZ);
        vehicle.addWheel(options); // RL
        options.chassisConnectionPointLocal.set(-wheelX, wheelY, -wheelZ);
        vehicle.addWheel(options); // RR
        vehicle.addToWorld(world);

        const wheelVisuals = [];
        for (let i = 0; i < vehicle.wheelInfos.length; i++) {
            const geo = new THREE.CylinderGeometry(options.radius, options.radius, 0.4, 24);
            geo.rotateZ(Math.PI / 2);
            const mat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
            wheelVisuals.push(mesh);
        }
        
        world.addEventListener('postStep', () => {
            for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                vehicle.updateWheelTransform(i);
                const t = vehicle.wheelInfos[i].worldTransform;
                wheelVisuals[i].position.copy(t.position);
                wheelVisuals[i].quaternion.copy(t.quaternion);
            }
        });

        // --- BOOST EFFECTS ---
        const boostLight = new THREE.PointLight(0x00ffff, 0, 15);
        scene.add(boostLight);
        
        const exhaustGeo = new THREE.ConeGeometry(0.4, 1.5, 16);
        exhaustGeo.rotateX(Math.PI / 2);
        const exhaustMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
        const exhaustMesh = new THREE.Mesh(exhaustGeo, exhaustMat);
        exhaustMesh.visible = false;
        scene.add(exhaustMesh);

        // --- RESET LOGIC ---
        function resetBall() {
            ballBody.position.set(0, 10, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
        }

        function resetCar() {
            chassisBody.position.set(0, 2, 40);
            chassisBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI); // Face ball
            chassisBody.velocity.set(0, 0, 0);
            chassisBody.angularVelocity.set(0, 0, 0);
        }

        // --- CONTROLS (WASD, J, K) ---
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if (key === 'j') keys.j = true;  // Boost
            if (key === 'r') resetBall();
            if (key === 't') resetCar();

            // K to Jump / Flip
            if (key === 'k') {
                keys.k = true;
                const isGrounded = vehicle.wheelInfos.some(w => w.inContact);
                
                if (isGrounded) {
                    // Jump
                    chassisBody.applyLocalImpulse(new CANNON.Vec3(0, 1200, 0), new CANNON.Vec3(0, 0, 0));
                    jumpState = 1;
                } else if (jumpState === 1) {
                    // Mid-air flip
                    jumpState = 2; 
                    let flipImpulse = new CANNON.Vec3(0, 0, 0);
                    let torqueImpulse = new CANNON.Vec3(0, 0, 0);
                    
                    if (keys.w) { torqueImpulse.x = -6000; flipImpulse.z = 1500; } // Forward
                    if (keys.s) { torqueImpulse.x = 6000; flipImpulse.z = -1500; } // Back
                    if (keys.a) { torqueImpulse.z = 6000; flipImpulse.x = 1500; }  // Left
                    if (keys.d) { torqueImpulse.z = -6000; flipImpulse.x = -1500; } // Right
                    
                    if(keys.w || keys.s || keys.a || keys.d) {
                        chassisBody.applyLocalImpulse(flipImpulse, new CANNON.Vec3(0, 0, 0));
                        chassisBody.applyTorque(chassisBody.quaternion.vmult(torqueImpulse));
                    } else {
                        // Double jump
                        chassisBody.applyLocalImpulse(new CANNON.Vec3(0, 1000, 0), new CANNON.Vec3(0, 0, 0));
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if (key === 'j') keys.j = false;
            if (key === 'k') keys.k = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resetBall();
        resetCar();

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            
            world.step(1 / 60, dt, 3);

            // Sync Main Meshes
            carGroup.position.copy(chassisBody.position);
            carGroup.quaternion.copy(chassisBody.quaternion);
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            const isGrounded = vehicle.wheelInfos.some(w => w.inContact);
            if (isGrounded) jumpState = 0;

            // --- CAR LOGIC ---
            const engineForce = 1200;
            const maxSteerVal = 0.45; // Limit steering angle to prevent snapping

            if (isGrounded) {
                // Driving
                if (keys.w) vehicle.applyEngineForce(-engineForce, 2), vehicle.applyEngineForce(-engineForce, 3);
                else if (keys.s) vehicle.applyEngineForce(engineForce, 2), vehicle.applyEngineForce(engineForce, 3);
                else vehicle.applyEngineForce(0, 2), vehicle.applyEngineForce(0, 3);

                // Steering
                if (keys.a) vehicle.setSteeringValue(maxSteerVal, 0), vehicle.setSteeringValue(maxSteerVal, 1);
                else if (keys.d) vehicle.setSteeringValue(-maxSteerVal, 0), vehicle.setSteeringValue(-maxSteerVal, 1);
                else vehicle.setSteeringValue(0, 0), vehicle.setSteeringValue(0, 1);
            } else {
                // Mid-air Rotation
                vehicle.applyEngineForce(0, 2), vehicle.applyEngineForce(0, 3);
                vehicle.setSteeringValue(0, 0), vehicle.setSteeringValue(0, 1);

                const torque = new CANNON.Vec3(0, 0, 0);
                if (keys.w) torque.x = -1200;
                if (keys.s) torque.x = 1200;
                if (keys.a) torque.z = 1200;
                if (keys.d) torque.z = -1200;
                
                if (torque.lengthSquared() > 0) {
                    chassisBody.applyTorque(chassisBody.quaternion.vmult(torque));
                }
            }

            // Boost Logic (J Key)
            if (keys.j) {
                const boostForce = new CANNON.Vec3(0, 0, -2000); // Push forward in local space
                chassisBody.applyLocalForce(boostForce, new CANNON.Vec3(0, 0, 0));
                
                // Visuals
                const backOffset = new THREE.Vector3(0, 0, 1.5).applyQuaternion(carGroup.quaternion);
                const exhaustPos = carGroup.position.clone().add(backOffset);
                
                boostLight.position.copy(exhaustPos);
                boostLight.intensity = 2;
                
                exhaustMesh.position.copy(exhaustPos);
                exhaustMesh.quaternion.copy(carGroup.quaternion);
                exhaustMesh.visible = true;
            } else {
                boostLight.intensity = 0;
                exhaustMesh.visible = false;
            }

            // --- CAMERA FOLLOW ---
            const relativeCameraOffset = new THREE.Vector3(0, 6, 15);
            const cameraOffset = relativeCameraOffset.applyMatrix4(carGroup.matrixWorld);
            camera.position.lerp(cameraOffset, 0.15); // Smooth camera tracking
            
            const lookTarget = new THREE.Vector3(0, 0, -10).applyMatrix4(carGroup.matrixWorld);
            camera.lookAt(lookTarget);

            // --- GOAL LOGIC ---
            if (!scoreBlocked) {
                const inXBounds = Math.abs(ballBody.position.x) < goalWidth / 2;
                const inBlueGoal = ballBody.position.z > (arenaLength / 2) && inXBounds;
                const inOrangeGoal = ballBody.position.z < -(arenaLength / 2) && inXBounds;

                if (inBlueGoal || inOrangeGoal) {
                    scoreBlocked = true;
                    const msg = document.getElementById('message');
                    msg.classList.add('show-msg');
                    msg.style.color = inBlueGoal ? '#00aaff' : '#ffaa00'; 
                    msg.innerText = inBlueGoal ? "BLUE SCORES!" : "ORANGE SCORES!";

                    setTimeout(() => {
                        resetBall();
                        resetCar();
                        msg.classList.remove('show-msg');
                        scoreBlocked = false;
                    }, 2500);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
