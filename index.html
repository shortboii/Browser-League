<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser League - Pro Aerial Edition</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #58a6ff;
            --bg: #050510;
            --panel: rgba(13, 17, 23, 0.88);
            --border: #30363d;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c9d1d9;
            user-select: none;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            width: 300px;
        }

        #ui-container h3 {
            margin: 0 0 14px 0;
            color: var(--primary);
            font-size: 17px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }

        .key-group {
            display: flex;
            gap: 4px;
        }

        .key {
            background: #21262d;
            padding: 3px 7px;
            border-radius: 5px;
            border: 1px solid var(--border);
            color: #ffffff;
            font-family: monospace;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 2px 0 #161b22;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            background: var(--panel);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        .hud-metric {
            text-align: center;
        }

        .hud-metric .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
        }

        .hud-metric .value {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            font-family: monospace;
        }

        #message {
            position: absolute;
            top: 25%;
            width: 100%;
            text-align: center;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .show-msg {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h3>Aerial Controls</h3>
        <div class="control-row">
            <span>Drive / Reverse</span>
            <div class="key-group">
                <span class="key">W</span>
                <span class="key">S</span>
            </div>
        </div>
        <div class="control-row">
            <span>Steering / Air Roll</span>
            <div class="key-group">
                <span class="key">A</span>
                <span class="key">D</span>
            </div>
        </div>
        <div class="control-row">
            <span>Turbo Boost</span>
            <span class="key">J</span>
        </div>
        <div class="control-row">
            <span>Jump / Double-Jump Flip</span>
            <span class="key">K</span>
        </div>
        <div class="control-row">
            <span>Air Pitch (Forward/Back)</span>
            <div class="key-group">
                <span class="key">↑</span>
                <span class="key">↓</span>
            </div>
        </div>
        <div class="control-row">
            <span>Reset Ball / Car</span>
            <div class="key-group">
                <span class="key">R</span>
                <span class="key">T</span>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="hud-metric">
            <div class="label">Speed</div>
            <div id="speed-val" class="value">0 KM/H</div>
        </div>
        <div class="hud-metric">
            <div class="label">Flight State</div>
            <div id="flight-val" class="value" style="color: var(--primary);">GROUNDED</div>
        </div>
    </div>

    <div id="message">GOAL!</div>

    <!-- CDNs for Three.js and Cannon-es -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        class RocketBallAerialGame {
            constructor() {
                this.keys = { w: false, a: false, s: false, d: false, j: false, k: false, up: false, down: false };
                this.scoreBlocked = false;
                
                // Arena Dimensions
                this.arenaLength = 180;
                this.arenaWidth = 110;
                this.wallHeight = 35;
                this.goalWidth = 26;
                this.goalDepth = 12;
                this.goalHeight = 12;

                // Car Flight & Physics Properties
                this.carSpeed = 0;
                this.maxSpeed = 48;
                this.boostMultiplier = 1.9;
                this.acceleration = 38;
                this.braking = 55;
                this.steeringAngle = 0;
                this.maxSteerVal = 0.7;
                
                // Euler Orientation trackers for aerial rolls & flips
                this.carPitch = 0;
                this.carYaw = Math.PI;
                this.carRoll = 0;
                this.isGrounded = false;
                this.hasDoubleJumped = false;

                this.initEngine();
                this.initEnvironment();
                this.initBall();
                this.initCar();
                this.initListeners();
                this.animate();
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x050511);
                this.scene.fog = new THREE.FogExp2(0x050511, 0.0025);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
                this.scene.add(ambientLight);

                const mainLight = new THREE.DirectionalLight(0xffffff, 0.85);
                mainLight.position.set(50, 130, 50);
                mainLight.castShadow = true;
                mainLight.shadow.mapSize.width = 2048;
                mainLight.shadow.mapSize.height = 2048;
                mainLight.shadow.camera.near = 0.5;
                mainLight.shadow.camera.far = 300;
                const d = 110;
                mainLight.shadow.camera.left = -d;
                mainLight.shadow.camera.right = d;
                mainLight.shadow.camera.top = d;
                mainLight.shadow.camera.bottom = -d;
                this.scene.add(mainLight);

                // Physics World
                this.world = new CANNON.World();
                this.world.gravity.set(0, -28, 0); // Custom snappy gravity
                this.world.broadphase = new CANNON.NaiveBroadphase();
                this.world.solver.iterations = 12;

                this.groundMat = new CANNON.Material('ground');
                this.ballMat = new CANNON.Material('ball');
                this.carMat = new CANNON.Material('car');

                this.world.addContactMaterial(new CANNON.ContactMaterial(this.groundMat, this.ballMat, { friction: 0.1, restitution: 0.85 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.groundMat, this.carMat, { friction: 0.2, restitution: 0.05 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.carMat, this.ballMat, { friction: 0.4, restitution: 0.9 }));
            }

            initEnvironment() {
                const grid = new THREE.GridHelper(this.arenaLength, 50, 0x00ff88, 0x161b22);
                grid.position.y = 0.02;
                this.scene.add(grid);

                const floorGeo = new THREE.PlaneGeometry(this.arenaWidth, this.arenaLength);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x090d19, roughness: 0.8, metalness: 0.2 });
                const floorMesh = new THREE.Mesh(floorGeo, floorMat);
                floorMesh.rotation.x = -Math.PI / 2;
                floorMesh.receiveShadow = true;
                this.scene.add(floorMesh);

                const floorBody = new CANNON.Body({ mass: 0, material: this.groundMat });
                floorBody.addShape(new CANNON.Box(new CANNON.Vec3(this.arenaWidth / 2, 0.5, this.arenaLength / 2)));
                floorBody.position.set(0, -0.5, 0);
                this.world.addBody(floorBody);

                // Glass Boundaries
                const createBoundary = (x, y, z, w, h, d) => {
                    const body = new CANNON.Body({ mass: 0, material: this.groundMat });
                    body.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)));
                    body.position.set(x, y, z);
                    this.world.addBody(body);

                    const meshGeo = new THREE.BoxGeometry(w, h, d);
                    const meshMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.06, roughness: 0.1 });
                    const mesh = new THREE.Mesh(meshGeo, meshMat);
                    mesh.position.set(x, y, z);
                    this.scene.add(mesh);

                    const edges = new THREE.EdgesGeometry(meshGeo);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.25 }));
                    line.position.set(x, y, z);
                    this.scene.add(line);
                };

                createBoundary(this.arenaWidth/2 + 1, this.wallHeight/2, 0, 2, this.wallHeight, this.arenaLength);
                createBoundary(-this.arenaWidth/2 - 1, this.wallHeight/2, 0, 2, this.wallHeight, this.arenaLength);

                const segWidth = (this.arenaWidth - this.goalWidth) / 2;
                const offset = this.goalWidth/2 + segWidth/2;

                createBoundary(offset, this.wallHeight/2, this.arenaLength/2 + 1, segWidth, this.wallHeight, 2);
                createBoundary(-offset, this.wallHeight/2, this.arenaLength/2 + 1, segWidth, this.wallHeight, 2);
                createBoundary(0, this.wallHeight/2 + this.goalHeight/2, this.arenaLength/2 + 1, this.goalWidth, this.wallHeight - this.goalHeight, 2);

                createBoundary(offset, this.wallHeight/2, -this.arenaLength/2 - 1, segWidth, this.wallHeight, 2);
                createBoundary(-offset, this.wallHeight/2, -this.arenaLength/2 - 1, segWidth, this.wallHeight, 2);
                createBoundary(0, this.wallHeight/2 + this.goalHeight/2, -this.arenaLength/2 - 1, this.goalWidth, this.wallHeight - this.goalHeight, 2);

                const ceilingBody = new CANNON.Body({ mass: 0, material: this.groundMat });
                ceilingBody.addShape(new CANNON.Box(new CANNON.Vec3(this.arenaWidth/2, 1, this.arenaLength/2)));
                ceilingBody.position.set(0, this.wallHeight, 0);
                this.world.addBody(ceilingBody);

                // Goals
                const createGoalStructure = (zPos, colorHex) => {
                    const goalBox = new THREE.Mesh(
                        new THREE.BoxGeometry(this.goalWidth, this.goalHeight, this.goalDepth),
                        new THREE.MeshStandardMaterial({ color: colorHex, wireframe: true, emissive: colorHex, emissiveIntensity: 0.5 })
                    );
                    goalBox.position.set(0, this.goalHeight/2, zPos);
                    this.scene.add(goalBox);

                    const gLight = new THREE.PointLight(colorHex, 2, 50);
                    gLight.position.set(0, this.goalHeight/2, zPos);
                    this.scene.add(gLight);
                };

                createGoalStructure(this.arenaLength/2 + this.goalDepth/2, 0x00aaff);
                createGoalStructure(-this.arenaLength/2 - this.goalDepth/2, 0xff5500);
            }

            initBall() {
                const radius = 2.2;
                this.ballBody = new CANNON.Body({
                    mass: 1.2,
                    material: this.ballMat,
                    linearDamping: 0.04,
                    angularDamping: 0.04
                });
                this.ballBody.addShape(new CANNON.Sphere(radius));
                this.world.addBody(this.ballBody);

                const ballGeo = new THREE.SphereGeometry(radius, 32, 32);
                const ballMat = new THREE.MeshStandardMaterial({ color: 0xf0f6fc, roughness: 0.2, metalness: 0.4 });
                this.ballMesh = new THREE.Mesh(ballGeo, ballMat);
                this.ballMesh.castShadow = true;
                this.scene.add(this.ballMesh);

                this.resetBallPos();
            }

            initCar() {
                this.carWidth = 2.2;
                this.carHeight = 0.9;
                this.carLength = 4.6;

                this.carBody = new CANNON.Body({
                    mass: 160,
                    material: this.carMat,
                    linearDamping: 0.1,
                    angularDamping: 0.4
                });
                this.carBody.addShape(new CANNON.Box(new CANNON.Vec3(this.carWidth/2, this.carHeight/2, this.carLength/2)));
                this.world.addBody(this.carBody);

                this.carGroup = new THREE.Group();
                this.scene.add(this.carGroup);

                const bodyGeo = new THREE.BoxGeometry(this.carWidth, this.carHeight, this.carLength);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.25, metalness: 0.85 });
                const mainMesh = new THREE.Mesh(bodyGeo, bodyMat);
                mainMesh.castShadow = true;
                mainMesh.position.y = 0.2;
                this.carGroup.add(mainMesh);

                const cockpitGeo = new THREE.BoxGeometry(this.carWidth * 0.7, 0.45, this.carLength * 0.4);
                const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x11161d, roughness: 0.1, metalness: 0.9 });
                const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
                cockpit.position.set(0, 0.55, -0.2);
                this.carGroup.add(cockpit);

                const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 24);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
                
                this.wheels = [];
                const wheelOffsets = [
                    new THREE.Vector3(1.1, -0.2, 1.4),
                    new THREE.Vector3(-1.1, -0.2, 1.4),
                    new THREE.Vector3(1.1, -0.2, -1.4),
                    new THREE.Vector3(-1.1, -0.2, -1.4)
                ];

                wheelOffsets.forEach(offset => {
                    const wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
                    wheelMesh.castShadow = true;
                    this.scene.add(wheelMesh);
                    this.wheels.push({ mesh: wheelMesh, offset: offset });
                });

                this.boostLight = new THREE.PointLight(0x00ffff, 0, 15);
                this.scene.add(this.boostLight);

                const exhaustGeo = new THREE.ConeGeometry(0.35, 1.3, 12);
                exhaustGeo.rotateX(Math.PI / 2);
                const exhaustMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9 });
                this.exhaustMesh = new THREE.Mesh(exhaustGeo, exhaustMat);
                this.exhaustMesh.visible = false;
                this.scene.add(this.exhaustMesh);

                this.resetCarPos();
            }

            resetBallPos() {
                this.ballBody.position.set(0, 8, 0);
                this.ballBody.velocity.set(0, 0, 0);
                this.ballBody.angularVelocity.set(0, 0, 0);
            }

            resetCarPos() {
                this.carBody.position.set(0, 2, 45);
                this.carYaw = Math.PI;
                this.carPitch = 0;
                this.carRoll = 0;
                this.carBody.quaternion.setFromEuler(this.carPitch, this.carYaw, this.carRoll, 'YXZ');
                this.carBody.velocity.set(0, 0, 0);
                this.carBody.angularVelocity.set(0, 0, 0);
                this.carSpeed = 0;
                this.steeringAngle = 0;
                this.hasDoubleJumped = false;
            }

            initListeners() {
                window.addEventListener('keydown', (e) => this.handleInput(e, true));
                window.addEventListener('keyup', (e) => this.handleInput(e, false));
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            handleInput(e, isDown) {
                const key = e.key.toLowerCase();
                if (key === 'w' || e.key === 'ArrowUp') {
                    if (e.key === 'ArrowUp') this.keys.up = isDown;
                    else this.keys.w = isDown;
                }
                if (key === 's' || e.key === 'ArrowDown') {
                    if (e.key === 'ArrowDown') this.keys.down = isDown;
                    else this.keys.s = isDown;
                }
                if (key === 'a' || e.key === 'ArrowLeft') this.keys.a = isDown;
                if (key === 'd' || e.key === 'ArrowRight') this.keys.d = isDown;
                if (key === 'j') this.keys.j = isDown;

                if (isDown) {
                    if (key === 'r') this.resetBallPos();
                    if (key === 't') this.resetCarPos();
                    if (key === 'k') {
                        // Ground Jump & Aerial Double-Jump Flip Mechanics
                        if (this.isGrounded) {
                            this.carBody.velocity.y = 13.5;
                            this.isGrounded = false;
                            this.hasDoubleJumped = false;
                        } else if (!this.hasDoubleJumped) {
                            // Rocket League style aerial flip boost impulse
                            this.carBody.velocity.y += 10;
                            const forwardVec = new CANNON.Vec3(Math.sin(this.carYaw), 0, Math.cos(this.carYaw)).scale(-16);
                            this.carBody.velocity.x += forwardVec.x;
                            this.carBody.velocity.z += forwardVec.z;
                            this.carPitch -= 0.8; // Quick flip rotation snap
                            this.hasDoubleJumped = true;
                        }
                    }
                }
            }

            updateDriving(dt) {
                // Ground check based on vertical position offset
                this.isGrounded = this.carBody.position.y < 1.6;

                if (this.isGrounded) {
                    // Ground Steering
                    if (this.keys.a) {
                        this.steeringAngle = Math.min(this.steeringAngle + 3.2 * dt, this.maxSteerVal);
                    } else if (this.keys.d) {
                        this.steeringAngle = Math.max(this.steeringAngle - 3.2 * dt, -this.maxSteerVal);
                    } else {
                        this.steeringAngle *= Math.pow(0.01, dt);
                    }

                    if (Math.abs(this.carSpeed) > 0.5) {
                        const turnFactor = (this.carSpeed > 0) ? 1 : -1;
                        this.carYaw += this.steeringAngle * turnFactor * dt * 2.4;
                    }

                    let targetMaxSpeed = this.maxSpeed;
                    if (this.keys.j) targetMaxSpeed *= this.boostMultiplier;

                    if (this.keys.w) {
                        const accel = this.keys.j ? this.acceleration * 1.6 : this.acceleration;
                        this.carSpeed = Math.min(this.carSpeed + accel * dt, targetMaxSpeed);
                    } else if (this.keys.s) {
                        this.carSpeed = Math.max(this.carSpeed - this.braking * dt, -this.maxSpeed * 0.4);
                    } else {
                        this.carSpeed *= Math.pow(0.15, dt);
                        if (Math.abs(this.carSpeed) < 0.2) this.carSpeed = 0;
                    }

                    const forwardDir = new CANNON.Vec3(Math.sin(this.carYaw), 0, Math.cos(this.carYaw));
                    this.carBody.velocity.x = -forwardDir.x * this.carSpeed;
                    this.carBody.velocity.z = -forwardDir.z * this.carSpeed;
                    
                    // Align pitch/roll back smoothly to flat ground orientation
                    this.carPitch *= Math.pow(0.001, dt);
                    this.carRoll *= Math.pow(0.001, dt);
                } else {
                    // Full 3D Aerial Air-Control & Flight Mechanics
                    if (this.keys.a) this.carRoll += 3.5 * dt;   // Air Roll Left
                    if (this.keys.d) this.carRoll -= 3.5 * dt;   // Air Roll Right
                    if (this.keys.up) this.carPitch -= 3.0 * dt; // Pitch Forward
                    if (this.keys.down) this.carPitch += 3.0 * dt;// Pitch Backward

                    if (this.keys.j) {
                        // Aerial Boost Thruster Impulse
                        const aimDir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(this.carPitch, this.carYaw, this.carRoll, 'YXZ'));
                        this.carBody.velocity.x += aimDir.x * 35 * dt;
                        this.carBody.velocity.y += aimDir.y * 35 * dt;
                        this.carBody.velocity.z += aimDir.z * 35 * dt;
                    }

                    // Gentle aerial drag reduction
                    this.carBody.velocity.x *= 0.99;
                    this.carBody.velocity.z *= 0.99;
                }

                // Apply full 3D rotation quaternion from Euler angles (Yaw, Pitch, Roll)
                const cannonEuler = new CANNON.Quaternion();
                cannonEuler.setFromEuler(this.carPitch, this.carYaw, this.carRoll, 'YXZ');
                this.carBody.quaternion.copy(cannonEuler);
            }

            checkGoals() {
                if (this.scoreBlocked) return;

                const ballPos = this.ballBody.position;
                const inXBounds = Math.abs(ballPos.x) < this.goalWidth / 2;
                const inBlueGoal = ballPos.z > (this.arenaLength / 2) && inXBounds;
                const inOrangeGoal = ballPos.z < -(this.arenaLength / 2) && inXBounds;

                if (inBlueGoal || inOrangeGoal) {
                    this.scoreBlocked = true;
                    const msg = document.getElementById('message');
                    msg.classList.add('show-msg');
                    msg.style.color = inBlueGoal ? '#58a6ff' : '#ff5500';
                    msg.innerText = inBlueGoal ? "BLUE SCORES!" : "ORANGE SCORES!";

                    setTimeout(() => {
                        this.resetBallPos();
                        this.resetCarPos();
                        msg.classList.remove('show-msg');
                        this.scoreBlocked = false;
                    }, 2500);
                }
            }

            updateHUD() {
                const currentKmH = Math.round(Math.abs(this.carSpeed) * 3.6);
                document.getElementById('speed-val').innerText = `${currentKmH} KM/H`;
                
                const flightValEl = document.getElementById('flight-val');
                if (!this.isGrounded) {
                    flightValEl.innerText = "AIRBORNE";
                    flightValEl.style.color = "#00ffff";
                } else {
                    flightValEl.innerText = "GROUNDED";
                    flightValEl.style.color = "#00ff88";
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const dt = 1 / 60;
                this.updateDriving(dt);
                this.world.step(dt);
                this.checkGoals();
                this.updateHUD();

                // Sync Visual Meshes
                this.carGroup.position.copy(this.carBody.position);
                this.carGroup.quaternion.copy(this.carBody.quaternion);

                this.ballMesh.position.copy(this.ballBody.position);
                this.ballMesh.quaternion.copy(this.ballBody.quaternion);

                this.wheels.forEach((w, idx) => {
                    const worldPos = w.offset.clone().applyQuaternion(this.carGroup.quaternion).add(this.carGroup.position);
                    w.mesh.position.copy(worldPos);
                    w.mesh.quaternion.copy(this.carGroup.quaternion);

                    if (idx < 2) {
                        const steeringQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.steeringAngle);
                        w.mesh.quaternion.multiply(steeringQuaternion);
                    }
                });

                if (this.keys.j) {
                    const backOffset = new THREE.Vector3(0, 0.2, 1.8).applyQuaternion(this.carGroup.quaternion);
                    const exhaustPos = this.carGroup.position.clone().add(backOffset);
                    
                    this.boostLight.position.copy(exhaustPos);
                    this.boostLight.intensity = 3.5;
                    
                    this.exhaustMesh.position.copy(exhaustPos);
                    this.exhaustMesh.quaternion.copy(this.carGroup.quaternion);
                    this.exhaustMesh.visible = true;
                } else {
                    this.boostLight.intensity = 0;
                    this.exhaustMesh.visible = false;
                }

                // Smooth Chase Camera
                const idealOffset = new THREE.Vector3(0, 5.5, 13).applyQuaternion(this.carGroup.quaternion);
                const targetCameraPos = this.carGroup.position.clone().add(idealOffset);
                this.camera.position.lerp(targetCameraPos, 0.15);

                const lookTarget = this.carGroup.position.clone().add(new THREE.Vector3(0, 1, -4).applyQuaternion(this.carGroup.quaternion));
                this.camera.lookAt(lookTarget);

                this.renderer.render(this.scene, this.camera);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new RocketBallAerialGame();
        });
    </script>
</body>
</html>
