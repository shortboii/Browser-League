<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser League - Arcade Mode</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(13, 17, 23, 0.85);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #ui h3 { margin: 0 0 15px 0; color: #58a6ff; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        #ui p { margin: 8px 0; font-size: 14px; }
        .key { 
            background: #21262d; 
            padding: 3px 8px; 
            border-radius: 4px; 
            border: 1px solid #30363d; 
            color: #c9d1d9;
            font-family: monospace;
            font-weight: bold;
        }
        #message {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0px 0px 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: scale(0.5);
            pointer-events: none;
        }
        .show-msg {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Controls</h3>
        <p><span class="key">W</span> <span class="key">S</span> &nbsp;Drive Forward / Reverse</p>
        <p><span class="key">A</span> <span class="key">D</span> &nbsp;Steer Left / Right</p>
        <p><span class="key">J</span> &nbsp;Boost</p>
        <p><span class="key">K</span> &nbsp;Jump</p>
        <p><span class="key">R</span> &nbsp;Reset Ball</p>
        <p><span class="key">T</span> &nbsp;Reset Car</p>
    </div>
    <div id="message">GOAL!</div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        // --- GAME STATE ---
        const keys = { w: false, a: false, s: false, d: false, j: false };
        let scoreBlocked = false;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 80, 250);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const stadiumLight = new THREE.PointLight(0xffffff, 0.8, 300);
        stadiumLight.position.set(0, 100, 0);
        scene.add(stadiumLight);

        // --- CANNON.JS WORLD SETUP ---
        const world = new CANNON.World({
            gravity: new CANNON.Vec3(0, -20, 0),
        });

        const groundMat = new CANNON.Material();
        const ballMat = new CANNON.Material();
        const carMat = new CANNON.Material();

        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, ballMat, { friction: 0.1, restitution: 0.8 }));
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, carMat, { friction: 0.3, restitution: 0.1 }));
        world.addContactMaterial(new CANNON.ContactMaterial(carMat, ballMat, { friction: 0.4, restitution: 0.7 }));

        // --- ENVIRONMENT SETUP ---
        const arenaLength = 160;
        const arenaWidth = 100;
        const wallHeight = 30;
        const goalWidth = 24;
        const goalDepth = 10;
        const goalHeight = 10;

        // Grid Floor Visual
        const gridHelper = new THREE.GridHelper(arenaLength, 40, 0x444455, 0x222233);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(arenaWidth, arenaLength);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        scene.add(floorMesh);

        // Physical Floor
        const floorBody = new CANNON.Body({ mass: 0, material: groundMat });
        floorBody.addShape(new CANNON.Box(new CANNON.Vec3(arenaWidth / 2, 0.5, arenaLength / 2)));
        floorBody.position.y = -0.5;
        world.addBody(floorBody);

        // Walls Helper
        const createWall = (x, y, z, width, height, depth) => {
            const body = new CANNON.Body({ mass: 0, material: groundMat });
            body.addShape(new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2)));
            body.position.set(x, y, z);
            world.addBody(body);

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.1 })
            );
            mesh.position.set(x, y, z);
            scene.add(mesh);
        };

        createWall(arenaWidth/2 + 1, wallHeight/2, 0, 2, wallHeight, arenaLength);
        createWall(-arenaWidth/2 - 1, wallHeight/2, 0, 2, wallHeight, arenaLength);
        
        const wallSegmentWidth = (arenaWidth - goalWidth) / 2;
        const segmentOffset = goalWidth/2 + wallSegmentWidth/2;
        createWall(segmentOffset, wallHeight/2, arenaLength/2 + 1, wallSegmentWidth, wallHeight, 2);
        createWall(-segmentOffset, wallHeight/2, arenaLength/2 + 1, wallSegmentWidth, wallHeight, 2);
        createWall(0, wallHeight/2 + goalHeight/2, arenaLength/2 + 1, goalWidth, wallHeight - goalHeight, 2);

        createWall(segmentOffset, wallHeight/2, -arenaLength/2 - 1, wallSegmentWidth, wallHeight, 2);
        createWall(-segmentOffset, wallHeight/2, -arenaLength/2 - 1, wallSegmentWidth, wallHeight, 2);
        createWall(0, wallHeight/2 + goalHeight/2, -arenaLength/2 - 1, goalWidth, wallHeight - goalHeight, 2);

        // Ceiling
        const ceilingBody = new CANNON.Body({ mass: 0, material: groundMat });
        ceilingBody.addShape(new CANNON.Box(new CANNON.Vec3(arenaWidth/2, 1, arenaLength/2)));
        ceilingBody.position.y = wallHeight;
        world.addBody(ceilingBody);

        // Goals
        const createGoal = (z, color) => {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(goalWidth, goalHeight, goalDepth),
                new THREE.MeshStandardMaterial({ color: color, wireframe: true, emissive: color, emissiveIntensity: 0.5 })
            );
            mesh.position.set(0, goalHeight/2, z);
            scene.add(mesh);
        };
        createGoal(-arenaLength/2 - goalDepth/2, 0xff5500);
        createGoal(arenaLength/2 + goalDepth/2, 0x0055ff);

        // --- BALL SETUP ---
        const ballRadius = 2.0;
        const ballBody = new CANNON.Body({ mass: 1, material: ballMat, linearDamping: 0.1, angularDamping: 0.1 });
        ballBody.addShape(new CANNON.Sphere(ballRadius));
        world.addBody(ballBody);

        const ballMesh = new THREE.Mesh(
            new THREE.SphereGeometry(ballRadius, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3 })
        );
        scene.add(ballMesh);

        // --- DIRECT ARCADE CAR SETUP ---
        const carWidth = 2.2;
        const carHeight = 0.8;
        const carLength = 4.4;

        const carBody = new CANNON.Body({ mass: 120, material: carMat });
        carBody.addShape(new CANNON.Box(new CANNON.Vec3(carWidth/2, carHeight/2, carLength/2)));
        carBody.linearDamping = 0.3;
        carBody.angularDamping = 0.8; // Keeps rotation stable
        world.addBody(carBody);

        const carMesh = new THREE.Mesh(
            new THREE.BoxGeometry(carWidth, carHeight, carLength),
            new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.4, metalness: 0.8 })
        );
        scene.add(carMesh);

        // Wheels Visuals
        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMatVisual = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheels = [
            new THREE.Mesh(wheelGeo, wheelMatVisual),
            new THREE.Mesh(wheelGeo, wheelMatVisual),
            new THREE.Mesh(wheelGeo, wheelMatVisual),
            new THREE.Mesh(wheelGeo, wheelMatVisual)
        ];
        wheels.forEach(w => scene.add(w));

        // --- RESET LOGIC ---
        function resetBall() {
            ballBody.position.set(0, 10, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
        }

        function resetCar() {
            carBody.position.set(0, 2, 40);
            carBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI);
            carBody.velocity.set(0, 0, 0);
            carBody.angularVelocity.set(0, 0, 0);
        }

        // --- CONTROLS ---
        let carHeading = Math.PI;

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (key === 'j') keys.j = true;
            if (key === 'r') resetBall();
            if (key === 't') resetCar();

            if (key === 'k') {
                // Simple Jump when near ground
                if (carBody.position.y < 1.5) {
                    carBody.velocity.y = 10;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (key === 'j') keys.j = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resetBall();
        resetCar();

        // --- GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            // --- ARCADE CAR PHYSICS CALCULATIONS ---
            const speedMultiplier = keys.j ? 50 : 25; // Boost increases speed
            
            if (keys.a) carHeading += 2.5 * dt;
            if (keys.d) carHeading -= 2.5 * dt;

            // Update car rotation based on heading
            carBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), carHeading);

            // Forward / Backward movement forces
            const forwardDir = new CANNON.Vec3(Math.sin(carHeading), 0, Math.cos(carHeading));
            
            if (keys.w) {
                carBody.velocity.x = -forwardDir.x * speedMultiplier;
                carBody.velocity.z = -forwardDir.z * speedMultiplier;
            } else if (keys.s) {
                carBody.velocity.x = forwardDir.x * (speedMultiplier * 0.5);
                carBody.velocity.z = forwardDir.z * (speedMultiplier * 0.5);
            } else {
                // Friction slowdown when no keys pressed
                carBody.velocity.x *= 0.9;
                carBody.velocity.z *= 0.9;
            }

            world.step(1 / 60, dt, 3);

            // --- SYNC MESHES ---
            carMesh.position.copy(carBody.position);
            carMesh.quaternion.copy(carBody.quaternion);

            // Position visual wheels relative to car body
            const wheelOffsets = [
                new THREE.Vector3(1.1, -0.4, 1.4),   // Front Right
                new THREE.Vector3(-1.1, -0.4, 1.4),  // Front Left
                new THREE.Vector3(1.1, -0.4, -1.4),  // Back Right
                new THREE.Vector3(-1.1, -0.4, -1.4)  // Back Left
            ];
            
            wheels.forEach((wheel, index) => {
                const worldPos = wheelOffsets[index].clone().applyQuaternion(carMesh.quaternion).add(carMesh.position);
                wheel.position.copy(worldPos);
                wheel.quaternion.copy(carMesh.quaternion);
            });

            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            // --- CAMERA FOLLOW ---
            const relativeCameraOffset = new THREE.Vector3(0, 6, 14);
            const cameraOffset = relativeCameraOffset.applyMatrix4(carMesh.matrixWorld);
            camera.position.lerp(cameraOffset, 0.15);
            
            const lookTarget = new THREE.Vector3(0, 0, -5).applyMatrix4(carMesh.matrixWorld);
            camera.lookAt(lookTarget);

            // --- GOAL DETECTION ---
            if (!scoreBlocked) {
                const inXBounds = Math.abs(ballBody.position.x) < goalWidth / 2;
                const inBlueGoal = ballBody.position.z > (arenaLength / 2) && inXBounds;
                const inOrangeGoal = ballBody.position.z < -(arenaLength / 2) && inXBounds;

                if (inBlueGoal || inOrangeGoal) {
                    scoreBlocked = true;
                    const msg = document.getElementById('message');
                    msg.classList.add('show-msg');
                    msg.style.color = inBlueGoal ? '#00aaff' : '#ffaa00'; 
                    msg.innerText = inBlueGoal ? "BLUE SCORES!" : "ORANGE SCORES!";

                    setTimeout(() => {
                        resetBall();
                        resetCar();
                        carHeading = Math.PI;
                        msg.classList.remove('show-msg');
                        scoreBlocked = false;
                    }, 2500);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
